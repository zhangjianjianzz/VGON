name: publish.yml
on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: astral-sh/setup-uv@v5

      - name: Build
        run: uv build

      - name: Check tooling
        run: |
          python -m pip install -U pip
          python -m pip install -U twine "pkginfo>=1.12.0" "packaging>=24.2" build
          python -m twine --version

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true